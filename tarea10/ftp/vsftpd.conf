# vsftpd - Configuracion FTP Tarea 10
# Replica logica de repositorio: carga de instaladores al volumen compartido

listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Usuario local con acceso al volumen compartido
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/ftp/uploads

# Modo pasivo (requerido en Docker)
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=172.20.0.30

# Seguridad
hide_ids=YES
ls_recurse_enable=YES
seccomp_sandbox=NO

# Logging
xferlog_enable=YES
xferlog_std_format=YES
log_ftp_protocol=YES
