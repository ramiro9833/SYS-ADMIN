<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Logo SYS-ADMIN personalizado">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="95" fill="url(#g2)" stroke="url(#g1)" stroke-width="4"/>
  <!-- Contenedor Docker estilizado -->
  <rect x="55" y="70" width="90" height="60" rx="8" fill="none" stroke="url(#g1)" stroke-width="3"/>
  <rect x="65" y="55" width="18" height="18" rx="3" fill="#38bdf8" opacity="0.8"/>
  <rect x="91" y="55" width="18" height="18" rx="3" fill="#38bdf8" opacity="0.6"/>
  <rect x="117" y="55" width="18" height="18" rx="3" fill="#38bdf8" opacity="0.4"/>
  <!-- Letra S estilizada -->
  <text x="100" y="115" text-anchor="middle" font-family="monospace" font-size="36" font-weight="bold" fill="url(#g1)">S</text>
  <!-- Texto inferior -->
  <text x="100" y="155" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">SYS-ADMIN</text>
  <text x="100" y="172" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#64748b">Tarea 10</text>
</svg>
