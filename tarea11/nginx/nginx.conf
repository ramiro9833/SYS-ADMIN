worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hardening: ocultar version de Nginx
    server_tokens off;

    sendfile on;
    keepalive_timeout 65;
    access_log /var/log/nginx/access.log;

    # Balanceador de carga hacia aplicaciones internas
    upstream backend_apps {
        least_conn;
        server web_app:8080 max_fails=3 fail_timeout=30s;
        server web_app_b:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8080;
        server_name _;

        # Healthcheck del balanceador
        location /health {
            access_log off;
            return 200 "nginx-ok\n";
            add_header Content-Type text/plain;
        }

        # Proxy hacia servicios web internos (sin puertos expuestos al host)
        location / {
            proxy_pass         http://backend_apps;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_hide_header  X-Powered-By;
            proxy_hide_header  Server;
        }
    }
}
