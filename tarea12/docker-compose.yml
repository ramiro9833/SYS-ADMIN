# tarea12/docker-compose.yml
# Tarea 12: Infraestructura de correo privada + Roundcube Webmail
# Stack: Postfix, Dovecot, Rspamd, Fail2ban, OpenDKIM + Portal Web
# Credenciales: archivo .env (sin hardcode)

name: sysadmin-tarea12

networks:
  mail_red:
    name: mail_red
    driver: bridge

volumes:
  mail_data:
    name: mail_data
  mail_state:
    name: mail_state
  mail_logs:
    name: mail_logs
  roundcube_db_data:
    name: roundcube_db_data

services:
  # ─── Servidor de correo (docker-mailserver) ─────────────────────────────────
  # Integra: Postfix, Dovecot, Rspamd, Fail2ban, OpenDKIM
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: tarea12_mailserver
    hostname: mail
    domainname: ${MAIL_DOMAIN}
    networks:
      mail_red:
        aliases:
          - mail.${MAIL_DOMAIN}
          - ${MAIL_HOSTNAME}
    ports:
      - "${SMTP_PORT}:25"
      - "${SUBMISSION_PORT}:587"
      - "${SMTPS_PORT}:465"
      - "${IMAP_PORT}:143"
      - "${IMAPS_PORT}:993"
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - ./docker-data/dms/config:/tmp/docker-mailserver
      - ./certs:/etc/dms/tls:ro
      - ./backups:/backups
    env_file:
      - ./mailserver/mailserver.env
    environment:
      - SSL_TYPE=manual
      - SSL_CERT_PATH=/etc/dms/tls/cert.pem
      - SSL_KEY_PATH=/etc/dms/tls/key.pem
    cap_add:
      - NET_ADMIN
    restart: always
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD-SHELL", "ss -lntp | grep -E ':25|:993' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Base de datos del portal Roundcube ────────────────────────────────────
  roundcube_db:
    image: mariadb:${MARIADB_VERSION}
    container_name: tarea12_roundcube_db
    hostname: roundcube_db
    networks:
      - mail_red
    environment:
      MYSQL_ROOT_PASSWORD: ${ROUNDCUBE_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ROUNDCUBE_DB_NAME}
      MYSQL_USER: ${ROUNDCUBE_DB_USER}
      MYSQL_PASSWORD: ${ROUNDCUBE_DB_PASSWORD}
    volumes:
      - roundcube_db_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Roundcube Webmail (cliente web PHP) ───────────────────────────────────
  roundcube:
    image: roundcube/roundcubemail:${ROUNDCUBE_VERSION}
    container_name: tarea12_roundcube
    hostname: roundcube
    networks:
      - mail_red
    depends_on:
      mailserver:
        condition: service_healthy
      roundcube_db:
        condition: service_healthy
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://${MAIL_HOSTNAME}
      ROUNDCUBEMAIL_DEFAULT_PORT: 993
      ROUNDCUBEMAIL_SMTP_SERVER: tls://${MAIL_HOSTNAME}
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_DB_TYPE: mysql
      ROUNDCUBEMAIL_DB_HOST: roundcube_db
      ROUNDCUBEMAIL_DB_PORT: 3306
      ROUNDCUBEMAIL_DB_NAME: ${ROUNDCUBE_DB_NAME}
      ROUNDCUBEMAIL_DB_USER: ${ROUNDCUBE_DB_USER}
      ROUNDCUBEMAIL_DB_PASSWORD: ${ROUNDCUBE_DB_PASSWORD}
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    volumes:
      - ./roundcube/config/custom.inc.php:/var/roundcube/config/custom.inc.php:ro
      - ./roundcube/skins/custom.css:/var/roundcube/skins/elastic/styles/custom.css:ro
      - ./roundcube/assets:/var/roundcube/skins/elastic/images/institutional:ro
    restart: always

  # ─── Proxy HTTPS (fuerza TLS para el portal web) ─────────────────────────────
  webmail_proxy:
    build:
      context: ./webmail-nginx
      dockerfile: Dockerfile
    container_name: tarea12_webmail_proxy
    hostname: webmail_proxy
    networks:
      - mail_red
    ports:
      - "${WEBMAIL_HTTP_PORT}:80"
      - "${WEBMAIL_HTTPS_PORT}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - roundcube
    restart: always

  # ─── Respaldo automatizado de buzones (cada 24h) ──────────────────────────
  mail_backup:
    image: alpine:3.19
    container_name: tarea12_mail_backup
    networks:
      - mail_red
    volumes:
      - mail_data:/var/mail:ro
      - mail_state:/var/mail-state:ro
      - ./backups:/backups
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
    environment:
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
    entrypoint: ["/bin/sh", "/backup_loop.sh"]
    restart: always
    depends_on:
      mailserver:
        condition: service_healthy
